<div style="font-family: 'Segoe UI', sans-serif; background: #fff; max-width: 600px; margin: auto; border-radius: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.1);">
    <div style="background: linear-gradient(to right, #00b4db, #0083b0); padding: 25px 20px; color: #fff; text-align: center;">
      <h2>📝 New Blog Alert!</h2>
    </div>
    <div style="padding: 25px 20px; color: #333;">
      <h3>{{blogTitle}}</h3>
      <p>{{blogSummary}}</p>
      <div style="margin: 20px 0; text-align: center;">
        <a href="{{blogUrl}}" style="background-color: #0083b0; color: white; padding: 10px 25px; border-radius: 30px; text-decoration: none;">Read Now</a>
      </div>
      <p>Written by <strong>{{authorName}}</strong></p>
    </div>
    <div style="background: #f1f1f1; padding: 15px; text-align: center; font-size: 12px; color: #777;">
      You are receiving this because you subscribed to blog updates from SpeakUp.
    </div>
  </div>
