static_sites:
  - name: speakup-client
    build_command: |
      echo "=== STARTING BUILD ===" && \
      cd client && \
      echo "Current directory: $(pwd)" && \
      echo "Contents:" && ls -la && \
      rm -rf node_modules package-lock.json && \
      npm install --legacy-peer-deps --force && \
      echo "Dependencies installed" && \
      npm list @vitejs/plugin-react && \
      npm run build
    publish: client/dist/
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"